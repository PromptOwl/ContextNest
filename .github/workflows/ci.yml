name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same ref to save CI minutes
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, Lint & Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint (type-check)
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Regression tests (CLI + MCP server)
        run: pnpm test:regression

  dependencies:
    name: Dependency graph
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The graph inspects each built bundle to prove every module it imports at
      # runtime is a declared dependency, so the dist/ output has to exist.
      - name: Build
        run: pnpm build

      # Fails if DEPENDENCIES.md no longer matches the installed tree — adding
      # or removing a dependency must land together with the published graph.
      - name: Verify the published dependency graph is current
        run: pnpm deps:check

      # What a dev installing from npm actually gets, resolved by npm itself
      # rather than pnpm. Informational: printed for review, never gates.
      - name: Resolve the tree with npm
        run: npm ls --all --omit=dev --prefix packages/cli || true

      - name: Upload the dependency graph
        uses: actions/upload-artifact@v4
        with:
          name: dependency-graph
          path: |
            DEPENDENCIES.md
            dependency-graph.json

  docker:
    name: Docker image (MCP server)
    runs-on: ubuntu-latest
    # The smoke test below relies on the server exiting when stdin closes; cap
    # the job so a regression there fails fast instead of hanging for 6 hours.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t contextnest-mcp .

      # Catches what `docker build` alone cannot: a wrong ENTRYPOINT path, or a
      # vault the server can't resolve/read at runtime.
      - name: Smoke-test the server over stdio
        run: |
          out=$(echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' | docker run -i --rm contextnest-mcp)
          echo "$out"
          echo "$out" | grep -q '"serverInfo"'
