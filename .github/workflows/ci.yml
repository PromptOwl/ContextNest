name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same ref to save CI minutes
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, Lint & Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint (type-check)
        run: pnpm lint

      # The MCPB bundle vendors the published mcp-server package, so a stale
      # manifest version ships a bundle that misreports what is inside it.
      - name: Check MCPB manifest version
        run: pnpm mcpb:check

      - name: Test
        run: pnpm test

      - name: Regression tests (CLI + MCP server)
        run: pnpm test:regression

  docker:
    name: Docker image (MCP server)
    runs-on: ubuntu-latest
    # The smoke test below relies on the server exiting when stdin closes; cap
    # the job so a regression there fails fast instead of hanging for 6 hours.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t contextnest-mcp .

      # Catches what `docker build` alone cannot: a wrong ENTRYPOINT path, or a
      # vault the server can't resolve/read at runtime.
      - name: Smoke-test the server over stdio
        run: |
          out=$(echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' | docker run -i --rm contextnest-mcp)
          echo "$out"
          echo "$out" | grep -q '"serverInfo"'
